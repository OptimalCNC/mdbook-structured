service:
  name: api
  enabled: true
  retries: 3
  ports:
    - 8080
    - 8443
  display:
    "": ""
    long: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-repeat-without-truncation"
    multiline: |-
      line one
      line two
features:
  - name: search
    enabled: true
    description: Search across documentation.
    settings:
      max-results: 20
      highlight: true
  - name: diagnostics
    enabled: false
    description: Collect diagnostic reports.
    settings:
      retention-days: 7
      verbose: false
metadata:
  null-value: null
  literal: "{{#include missing.md}}"
  html-looking: "<em>not markup</em>"
