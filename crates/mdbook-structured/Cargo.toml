[package]
name = "mdbook-structured"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An mdBook preprocessor that renders listed JSON and YAML chapters as structured HTML pages."
readme = "../../README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mdbook-structured"
keywords = ["mdbook", "preprocessor", "documentation", "json", "yaml"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
mdbook-core.workspace = true
mdbook-markdown.workspace = true
mdbook-structured-core.workspace = true
mdbook-preprocessor = "0.5"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "1"
toml_edit = "0.23"

[dev-dependencies]
assert_cmd = "2"
scraper = { workspace = true }
shlex = "1"
tempfile.workspace = true
