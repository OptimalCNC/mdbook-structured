[workspace]
members = ["crates/mdbook-structured-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
json-syntax = { version = "0.12", default-features = false }
proptest = "1"
rlsp-yaml-parser = "=0.11.1"
serde = "1"
serde_json = "1"
