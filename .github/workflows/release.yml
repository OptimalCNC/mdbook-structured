name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged commit with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag ancestry and package versions
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: scripts/release-check.sh validate normal

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict locked Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.3 --locked

      - name: Run locked workspace tests
        run: cargo test --workspace --locked

      - name: Build locked Rust documentation
        run: cargo doc --workspace --all-features --locked --no-deps

      - name: Package core crate
        run: cargo package --locked -p mdbook-structured-core

      - name: Package CLI crate
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: scripts/release-check.sh package-cli

  publish:
    name: Publish crates to crates.io
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated tag commit with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Confirm validated commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse --verify HEAD)"
          if [[ "$checked_out_commit" != "$RELEASE_COMMIT" ]]; then
            printf 'publish checkout %s differs from validated commit %s\n' \
              "$checked_out_commit" "$RELEASE_COMMIT" >&2
            exit 1
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Request short-lived crates.io token
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish core crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/publish-crate.sh mdbook-structured-core "$RELEASE_VERSION"

      - name: Wait for core crate index
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/release-check.sh wait-index mdbook-structured-core "$RELEASE_VERSION"

      - name: Publish CLI crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/publish-crate.sh mdbook-structured "$RELEASE_VERSION"

      - name: Verify exact non-yanked registry records
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/release-check.sh verify-registry
