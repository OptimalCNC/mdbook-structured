name: Bootstrap crates.io release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (only v0.1.0 is accepted)
        required: true
        default: v0.1.0
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate bootstrap tag
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Reject unsupported bootstrap input
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != 'v0.1.0' ]]; then
            printf 'bootstrap accepts only v0.1.0\n' >&2
            exit 1
          fi

      - name: Check out v0.1.0 with full history
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag ancestry and package versions
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: scripts/release-check.sh validate bootstrap

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict locked Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.3 --locked

      - name: Run locked workspace tests
        run: cargo test --workspace --locked

      - name: Build locked Rust documentation
        run: cargo doc --workspace --all-features --locked --no-deps

      - name: Package core crate
        run: cargo package --locked -p mdbook-structured-core

      - name: Package CLI crate
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: scripts/release-check.sh package-cli

  publish:
    name: Bootstrap crates.io packages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: crates-io-bootstrap
    permissions:
      contents: read
    steps:
      - name: Check out validated tag commit with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Confirm validated commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse --verify HEAD)"
          if [[ "$checked_out_commit" != "$RELEASE_COMMIT" ]]; then
            printf 'publish checkout %s differs from validated commit %s\n' \
              "$checked_out_commit" "$RELEASE_COMMIT" >&2
            exit 1
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish core crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh mdbook-structured-core 0.1.0

      - name: Wait for core crate index
        shell: bash
        env:
          RELEASE_VERSION: 0.1.0
        run: scripts/release-check.sh wait-index mdbook-structured-core "$RELEASE_VERSION"

      - name: Publish CLI crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh mdbook-structured 0.1.0

      - name: Verify exact non-yanked registry records
        shell: bash
        env:
          RELEASE_VERSION: 0.1.0
        run: scripts/release-check.sh verify-registry
